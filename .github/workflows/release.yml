# Release workflow — builds and pushes the Omnidev web + worker images to
# GitHub Container Registry (GHCR) on a version tag push.
#
# Triggered by: pushing a tag matching v*.*.* (e.g. `git tag v1.2.3 && git push --tags`)
# Also supports manual invocation via workflow_dispatch with a custom version.
#
# Resulting images (Docker convention strips the leading `v` from tag names):
#   ghcr.io/slaguardia/omnidev-web:1.2.3       — exact version, pin in prod
#   ghcr.io/slaguardia/omnidev-web:1.2         — floating within a minor
#   ghcr.io/slaguardia/omnidev-web:1           — floating within a major
#   ghcr.io/slaguardia/omnidev-web:latest      — floating across all releases
#   (same set for omnidev-worker)
#
# Both images are built multi-arch (linux/amd64 + linux/arm64) so cheap ARM
# VPS instances (Hetzner CAX, Oracle Ampere, etc.) work out of the box.
#
# Auth: GHCR push uses the built-in GITHUB_TOKEN. No additional secrets are
# required. The token is scoped to this repository only.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.2.3). Required for manual runs.'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: omnidev-web
            dockerfile: src/web/Dockerfile
          - image: omnidev-worker
            dockerfile: src/worker/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required to build arm64 images on an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate tags + labels from the git ref (or the manual input).
      # On a `v1.2.3` tag push, this produces image tags 1.2.3, 1.2, 1, latest.
      # On manual workflow_dispatch, the literal user-supplied version is the
      # only tag pushed (no floating tags) — that path is for ad-hoc testing,
      # not real releases.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Omnidev ${{ matrix.image }} image — see https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache makes the next release reuse layers instead
          # of rebuilding from scratch. Scoped per-image so web and worker
          # don't pollute each other's cache.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Print published tags
        run: |
          echo "Pushed ${{ matrix.image }} with tags:"
          echo "${{ steps.meta.outputs.tags }}"
