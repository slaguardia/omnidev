# Development configuration - automatically loaded with `docker compose up`
# Hot reload enabled via bind mounts

services:
  app:
    build:
      context: ..
      dockerfile: src/web/Dockerfile.dev
    container_name: omnidev-dev
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - GITLAB_URL=${GITLAB_URL:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - INITIAL_SIGNUP_TOKEN=${INITIAL_SIGNUP_TOKEN:-}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-100}
      - ALLOWED_IPS=${ALLOWED_IPS:-*}
    volumes:
      - ../:/app
      - workflow_node_modules:/app/node_modules
      - workflow_next_cache:/app/src/web/.next
      - workflow_workspaces:/app/workspaces
      - workflow_data:/app/data
      - workflow_claude_config:/home/nextjs/.claude
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: src/web/Dockerfile.dev
    container_name: omnidev-worker-dev
    depends_on:
      - app
    environment:
      - NODE_ENV=development
      # Skip redundant install only after app has populated workflow_node_modules (see src/web/docker-entrypoint-dev.sh)
      - SKIP_INSTALL=1
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - GITLAB_URL=${GITLAB_URL:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ../:/app
      - workflow_node_modules:/app/node_modules
      - workflow_workspaces:/app/workspaces
      - workflow_data:/app/data
      - workflow_claude_config:/home/nextjs/.claude
    command: ['pnpm', 'worker']
    restart: unless-stopped
