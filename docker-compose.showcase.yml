# Showcase mode - read-only, no auth, no dashboard
# Usage: docker compose -f docker-compose.yml -f docker-compose.showcase.yml up --build

services:
  init-perms:
    profiles: [] # Override profile to run by default

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SHOWCASE_MODE=true
    container_name: workflow-showcase
    depends_on:
      init-perms:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - SHOWCASE_MODE=true
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-showcase-mode-secret}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - workflow_workspaces:/app/workspaces
      - workflow_data:/app/data
      - workflow_secrets:/secrets
      - workflow_claude_config:/home/nextjs/.claude
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    entrypoint: ['/entrypoint.sh']
    command: ['node', 'server.js']
